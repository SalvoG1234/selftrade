project: selftrade

data:
  source: csv                # csv | freqtrade_json | synthetic | mt5
  csv: data/BTCUSDT_4h.csv   # real data/JSON: `data --fetch --rows 18000`
  datetime_col: timestamp
  timeframe: 4h
  symbol: BTC/USDT           # for FX/CFD (Trading.com): EURUSD
  min_rows: 800
  synthetic_rows: 12000
  max_rows: 0
  fetch_base_url: https://data-api.binance.vision   # keyless public klines
  fetch_timeout: 20.0

backtest:
  initial_cash: 10000.0
  fee_bps: 10.0              # spot taker is ~10 bps; for FX run `mt5 costs`
  slippage_bps: 5.0          # 15 bps per side = 30 bps round trip
  position_size: 0.95
  allow_short: false

evaluation:
  folds: 4
  train_frac: 0.6
  holdout_frac: 0.2
  min_trades: 8
  max_drawdown: 0.60
  metric: sharpe             # sharpe | sortino | return | calmar
  complexity_penalty: 0.01

evolution:
  generations: 10
  population: 10
  elite: 2
  seed: 7
  mode: explore              # params | explore
  mutation_rate: 0.35
  crossover: true

llm:
  enabled: true
  base_url: http://localhost:11434
  model: qwen2.5-coder:1.5b  # CPU-friendly; use qwen3-coder:30b / deepseek-r1:14b on a GPU
  embed_model: nomic-embed-text
  num_ctx: 8192
  num_predict: 512       # cap generation so slow/CPU Ollama stays bounded
  temperature: 0.2
  timeout: 180.0

rea:
  enabled: false
  dry_run: true
  node_cmd: npx
  package: rea-agents@latest
  provider: ghidra
  ghidra_dir: C:\tools\ghidra_12.1.4_PUBLIC
  java_home: C:\tools\jdk-21
  targets: []                # every target requires authorized: true

mt5:                         # Trading.com
  enabled: false             # talks to the terminal
  live: false                # ARMS the bridge for order sending
  require_demo: true         # a real account is refused
  require_stop: true
  terminal_path: 'C:\Program Files\MetaTrader 5\terminal64.exe'
  login: 0
  password_env: SELFTD_MT5_PASSWORD   # only the NAME of the variable
  server: ""                 # e.g. mt5-us.trading.com / Trading.comEU-MT5
  symbol: EURUSD
  suffix: ""
  timeframe: 1h
  bars: 20000
  deviation: 20
  magic: 20261009
  max_lots: 0.50
  max_positions: 1
  risk_pct: 0.005
  fixed_lots: 0.01
  sl_fallback_points: 500
  max_spread_points: 25
  allowed_symbols: []

binance:                     # Spot TESTNET by default
  enabled: false             # talks to the Binance API
  live: false                # ARMS order sending (two keys: this AND --live)
  allow_production: false    # opt in to a FUNDED host; off = a production URL is a config error.
                             # Even when true, every sent order passes the sealed risk gate
                             # (5%/2%/15%, exposure caps) and the kill switch first.
  base_url: https://testnet.binance.vision/api
  api_key_env: SELFTD_BINANCE_API_KEY       # only the NAME of the variable
  api_secret_env: SELFTD_BINANCE_API_SECRET
  symbol: BTC/USDT
  allowed_symbols: []
  quote_asset: USDT
  symbol_suffix: ""
  interval: 4h               # klines interval for live mark-to-market
  kline_bars: 500
  recv_window: 5000          # milliseconds, documented maximum 60000
  timeout: 15.0
  max_weight_per_min: 1200   # local ceiling on the weight Binance reports

risk_gate:                   # pre-trade checks; the sealed limits are NOT here
  enabled: true
  risk_pct: 0.005            # share of equity a single trade may risk
  max_positions: 1
  max_leverage: 1.0          # gross exposure / equity
  min_seconds_between_orders: 0.0
  min_notional: 1.0          # stand-in for a liquidity floor
  require_stop: true
  allowed_symbols: []        # empty = every symbol the broker serves

paper:
  # forward session: orders through the risk_gate below, sized at the sealed 5% cap
  window: holdout            # holdout | recent | full
  window_bars: 2000
  step_bars: 168
  max_ticks: 0

funding:                     # the SIMULATED capital account the agents work (docs/CAPITAL.md)
  enabled: true              # `capital deposit` needs this; the ledger itself always shows
  currency: USDT             # the unit credits are recorded in; no conversion is implied
  max_deposit: 100000.0      # largest single credit; 0 or negative refuses every credit
  max_total_capital: 1000000.0   # ceiling on total credited (deposits - withdrawals), ever
  allow_withdrawal: true     # whether the operator may take capital back out

dashboard:
  host: 127.0.0.1            # keep loopback; 0.0.0.0 opens the LAN (requires auth)
  port: 8787
  auto_refresh_s: 15         # panels refresh
  auth: true                 # login required; mandatory for a non-loopback bind
  password_env: SELFTD_DASHBOARD_PASSWORD   # only the NAME; when set it WINS over the stored password
  password_file: state/dashboard_auth.json  # the stored password: one salted hash, never the password
  password_min_length: 4                    # the dashboard starts on the bootstrap 0000 until you change it
  session_ttl_s: 86400
  market_symbol: BTC/USDT    # live chart from Binance public data (no keys)
  market_interval: 1m
  market_bars: 180
  market_refresh_s: 3.0
  key_refresh_s: 60.0        # Binance key panel: read-only probe cadence (needs binance.enabled)

session_file: state/session.json
memory:
  db: state/selftrade.db
notify:                      # risk alerts: the halt, and the warning before it
  enabled: false             # opt-in; needs both env vars below, and sends nothing otherwise
  telegram_token_env: SELFTD_TELEGRAM_TOKEN     # only the NAME of the variable
  telegram_chat_id_env: SELFTD_TELEGRAM_CHAT_ID # only the NAME; values are never printed
  warn_below_frac: 0.25      # warn when drawdown/daily loss have <=25% of their cap left (0 = off;
                             # a limit already PAST its cap is always announced)
  watch_interval_s: 30.0     # `notify watch` cadence; halts are announced once, never re-sent
                             # (docs/NOTIFICATIONS.md: the bands, the ledger, one watcher)
