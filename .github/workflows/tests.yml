name: tests

# The suite is the only claim this project makes that a reader can check without
# trusting the author, so it runs on every push.
#
# The matrix is the *declared* support, tested rather than asserted: `setup.ps1` and
# docs/WINDOWS-SETUP.md both say "Python 3.11+", so 3.11 is the oldest interpreter this
# has to satisfy, and the newest two cover what is actually run day to day. Ubuntu is
# the portable half; Windows is what the project targets (Windows 11 + PowerShell).
#
# The Windows-only MetaTrader5 bridge is not installed here on purpose: the tests use a
# fake terminal, and the "package missing" path is asserted explicitly, so every host
# exercises the same code.
on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    name: pytest (${{ matrix.os }}, ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Report the interpreter
        run: python -VV

      # The sealed risk layer is the one invariant a user is asked to trust without reading
      # the search code: the limits are a frozen dataclass, pinned by SHA-256, unreachable
      # from the config, a genome or the environment. If a commit ever moves them, this step
      # fails here rather than in someone's paper session.
      - name: Verify the sealed limits
        run: python -m selftrade risk verify

      - name: Run the suite
        run: python -m pytest -q

      # The suite size is quoted in the README, CONTRIBUTING, the verification ledger, the launch
      # kit and the social card, and a hand-typed number repeated five times is a number nobody
      # owns: every copy of it had drifted when `verify --ledger` was written. This collects the
      # suite (about two seconds) and fails if any of those counts disagrees with it. The matrix is
      # what makes it complete - the job on 3.13 is the one that enforces the fragment recorded on
      # 3.13, and the job on 3.14 the fragment recorded on 3.14.
      - name: Hold the documentation to the suite
        run: python -m selftrade verify --ledger

      # The suite states the session lock's rules one at a time; this runs the two writers
      # against each other for real, with the lost create race injected, on both platforms.
      # A stop overwritten by a writer, or any write performed beside the lock, exits 2.
      # Deliberately not --compare: the pre-fix control is for a human reading the output,
      # and a control that does not bite on a given runner would turn CI red for nothing.
      - name: Soak the session lock
        run: python -m selftrade lock-stress --rounds 10

  # The rest of this workflow holds the *textual* copies of the suite count to the suite. This job
  # holds the one copy a reader cannot check: `docs/img/social-preview.png` is a picture, so
  # `verify --ledger --write` can rewrite the HTML it is drawn from and leave the committed PNG
  # showing an older number, with nothing in the repository noticing. Two steps, because they prove
  # different things:
  #
  #   * `verify --card` reads the record the renderer wrote into the PNG - the count and the SHA-256
  #     of the source - and fails when either disagrees with this tree. No browser, about two
  #     seconds, and this is the step that cannot be got around.
  #   * `verify --card --render` draws the source again with the runner's own `google-chrome` and
  #     fails when it does not render, does not come out at 1280x640, or does not contain the
  #     measured count. It is deliberately *not* a byte comparison: font rasterisation differs
  #     between machines and Chrome releases, so byte equality would go red for reasons that have
  #     nothing to do with the number, and a check that cannot be satisfied gets deleted rather
  #     than fixed. There was a `--strict` flag that enforced it; it was removed after the same
  #     browser drew the same source twice on one machine into files 173 060 bytes apart, which is
  #     the measurement that says a re-drawing is not reproducible even locally.
  #
  # One job, not a matrix step: nothing here depends on the interpreter or the platform, and the
  # card is drawn once for everybody.
  card:
    name: social card (the picture cannot fall behind the number)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: The card records the source in this tree
        run: python -m selftrade verify --card

      - name: And the source still draws, at the right size, with today's count
        run: python -m selftrade verify --card --render
