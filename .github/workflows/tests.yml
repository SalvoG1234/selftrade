name: tests

# The suite is the only claim this project makes that a reader can check without
# trusting the author, so it runs on every push. Ubuntu is the portable half; Windows
# is what the project actually targets. The Windows-only MetaTrader5 bridge is not
# installed here on purpose: the tests use a fake terminal, and the "package missing"
# path is asserted explicitly, so both hosts exercise the same code.
on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    name: pytest (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Run the suite
        run: python -m pytest -q

      # The suite states the session lock's rules one at a time; this runs the two writers
      # against each other for real, with the lost create race injected, on both platforms.
      # A stop overwritten by a writer, or any write performed beside the lock, exits 2.
      # Deliberately not --compare: the pre-fix control is for a human reading the output,
      # and a control that does not bite on a given runner would turn CI red for nothing.
      - name: Soak the session lock
        run: python -m selftrade lock-stress --rounds 10
